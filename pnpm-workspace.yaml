packages:
  - apps/*
  - infra/*
  - oxlint-plugin-bibcode
  - packages/*
  - scripts

catalog:
  "@clerk/backend": 3.23.1
  "@clerk/clerk-js": 6.38.1
  "@clerk/react": 6.17.7
  "@clerk/shared": 4.39.1
  "@tauri-apps/api": 2.11.1
  "@effect/atom-react": 4.0.2
  "@effect/platform-node": 4.0.2
  "@effect/platform-node-shared": 4.0.2
  "@effect/sql-d1": 4.0.2
  "@effect/sql-pg": 4.0.2
  "@effect/sql-sqlite-do": 4.0.2
  "@effect/tsgo": 0.51.1
  "@effect/vitest": 4.0.2
  "@noble/ciphers": 2.4.0
  "@noble/curves": 2.4.0
  "@noble/hashes": 2.4.0
  "@pierre/diffs": 1.3.6
  "@types/node": 26.6.4
  effect: 4.0.2
  jose: 6.2.12
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  yaml: ^2.9.0

allowBuilds:
  "bufferutil@4.1.0": false
  "edgedriver@6.3.1": false
  "esbuild@0.25.12 || 0.28.2": true
  "geckodriver@6.1.1": false
  "msw@2.15.0": false
  "utf-8-validate@6.0.6": false
  "workerd@1.20260918.1": false

overrides:
  # Keep every Clerk consumer on the same stable train. Clerk publishes wallet
  # auth integrations as required dependencies, but BiBCode does not support
  # wallet auth, so keep that unused dependency tree out of installs.
  "@clerk/backend": "catalog:"
  "@clerk/clerk-js": "catalog:"
  "@clerk/react": "catalog:"
  "@clerk/shared": "catalog:"
  "@clerk/clerk-js>@base-org/account": "-"
  "@clerk/clerk-js>@coinbase/wallet-sdk": "-"
  "@clerk/clerk-js>@wallet-standard/core": "-"
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  # @effect/platform-node peers node-redis for its optional NodeRedis module.
  # BiBCode does not use Redis, so do not auto-install that unused client.
  "@effect/platform-node>redis": "-"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-d1": "catalog:"
  "@effect/sql-pg": "catalog:"
  "@effect/sql-sqlite-do": "catalog:"
  "@effect/vitest": "catalog:"
  # @effect/vitest is patched to use vite-plus/test; do not auto-install its
  # upstream Vitest peer and create a second Vite/Vitest toolchain.
  "@effect/vitest>vitest": "-"
  "@pierre/diffs>@shikijs/transformers": ^4.2.0
  "@types/node": "catalog:"
  # @wdio/tauri-service 1.2.0 was published against native-utils 2.4.0,
  # but its bundle imports installMockSyncOverride, which first ships in 2.5.0.
  "@wdio/tauri-service>@wdio/native-utils": 2.5.0
  effect: "catalog:"
  vite: "catalog:"
  vite-plus: "catalog:"
  yaml: "catalog:"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  "@effect/platform-node@*":
    peerDependenciesMeta:
      redis:
        optional: true

patchedDependencies:
  "@effect/vitest@4.0.2": patches/@effect__vitest@4.0.2.patch
  "@pierre/trees@1.0.0-beta.6": patches/@pierre__trees@1.0.0-beta.6.patch
  "@wdio/tauri-plugin@1.2.0": patches/@wdio__tauri-plugin@1.2.0.patch
  effect@4.0.2: patches/effect@4.0.2.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    "ws@7.5.11>utf-8-validate": 6.0.6
    vite: "*"
