[workspace]
members = ["apps/desktop/src-tauri", "apps/server", "tools/updater-verifier"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["form", "http1", "json", "tokio", "ws"] }
backtrace = "0.3.76"
base64 = "0.22.1"
block2 = "0.6"
breakpad-symbols = "=0.27.0"
cairo-rs = { version = "0.18", features = ["png"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
crash-handler = ">=0.8.1, <0.9"
dirs = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["pem", "pkcs8"] }
futures-util = { version = "0.3.34", features = ["sink"] }
getrandom = "0.4.3"
gtk = "0.18"
hmac = "0.13.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = { version = "1.11.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
if-addrs = "0.15.0"
junction = "2.0.0"
libc = "0.2"
mime_guess = "2.0.5"
# Profiler symbolication; the disassembler that names the faulting instruction is left out.
minidump = "=0.27.0"
minidump-processor = { version = "=0.27.0", default-features = false }
minidumper = "0.11"
minisign-verify = "=0.2.5"
notify = "8"
object = { version = "0.37.3", default-features = false, features = [
  "elf",
  "macho",
  "pe",
  "read_core",
  "std",
] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep", "NSGraphics"] }
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = [
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
  "WKBackForwardList",
] }
open = "5.4.3"
percent-encoding = "2.3.2"
p256 = { version = "0.14.0", features = ["ecdsa"] }
portpicker = "0.1.1"
portable-pty = "0.9.0"
process-wrap = { version = "9.1.0", features = ["tokio1"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "form",
  "json",
  "rustls",
  "stream",
] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "hooks"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
snow = "0.10"
socket2 = "0.6.5"
sysinfo = "0.39.6"
subtle = "2.6.1"
bibcode-server = { path = "apps/server" }
tauri = { version = "2.11.5", features = ["unstable", "devtools", "image-png"] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-shell = "2.3.6"
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
tauri-plugin-store = "2.4.4"
tauri-plugin-updater = "2.11.0"
tauri-plugin-wdio = "=1.2.0"
tauri-plugin-wdio-webdriver = "=1.2.0"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.19", features = ["io", "io-util", "rt"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.5"
tower-http = { version = "0.7.1", features = ["cors"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1.26.0", features = ["v4"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }
webview2-com = "0.38"
windows-sys = "0.61.2"
windows = "0.61"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.dependencies.tempfile]
version = "3.27.0"

[workspace.lints.rust]
warnings = "deny"

[patch.crates-io]
portable-pty = { path = "third_party/portable-pty" }
# Upstream fix for Windows reentrant keyboard/IME deadlocks; remove once Tauri uses Tao >= 0.36.
tao = { git = "https://github.com/tauri-apps/tao", rev = "c704261c519c58cfdd0bc2d58ba24e06a0b71c92" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Wry catches Objective-C exceptions when WebKit cancels URL-scheme tasks.
# panic=abort prevents that recovery and terminates the macOS host.
panic = "unwind"
