name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: false
        type: string
      publish:
        description: "Publish an already inspected stable draft"
        required: false
        default: false
        type: boolean
      validate_only:
        description: "Build and retain final assets without creating a tag or release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: none

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    # A cold publication preflight compiles the full Rust workspace through
    # `vp run test`; v0.5.9 approval runs reached both the old 30-minute and
    # 45-minute watchdogs with no failing test. Keep every gate and allow the
    # measured hosted-runner variance; the serialized test graph below trades
    # some wall-clock for tests that no longer share the CPU with rustc.
    timeout-minutes: 60
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      cli_dist_tag: ${{ steps.release_meta.outputs.cli_dist_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      is_update_candidate: ${{ steps.release_meta.outputs.is_update_candidate }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      publish_requested: ${{ steps.release_meta.outputs.publish_requested }}
      validate_only: ${{ steps.release_meta.outputs.validate_only }}
      ref: ${{ steps.release_meta.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_PUBLISH: ${{ github.event.inputs.publish }}
          DISPATCH_VALIDATE_ONLY: ${{ github.event.inputs.validate_only }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          NIGHTLY_SHA: ${{ github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          validate_only=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_VALIDATE_ONLY:-false}" == "true" ]]; then
            validate_only=true
          fi
          if [[ "$validate_only" == "true" && "${DISPATCH_PUBLISH:-false}" == "true" ]]; then
            echo "validate_only and publish cannot both be true." >&2
            exit 1
          fi
          echo "validate_only=$validate_only" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_CHANNEL:-stable}" == "nightly" ]]; then
            nightly_date="$(date -u +%Y%m%d)"

            node scripts/resolve-nightly-release.ts \
              --date "$nightly_date" \
              --run-number "$NIGHTLY_RUN_NUMBER" \
              --sha "$NIGHTLY_SHA" \
              --github-output

            echo "release_channel=nightly" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=nightly" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "is_update_candidate=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "publish_requested=false" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              raw="${DISPATCH_VERSION}"
              if [[ -z "$raw" ]]; then
                echo "workflow_dispatch stable releases require the version input." >&2
                exit 1
              fi
            else
              raw="${GITHUB_REF_NAME}"
            fi

            version="${raw#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: $raw" >&2
              exit 1
            fi

            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=BiBCode v$version" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=latest" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_PUBLISH:-false}" == "true" ]]; then
              echo "publish_requested=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish_requested=false" >> "$GITHUB_OUTPUT"
            fi
            if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
              echo "ref=$(git rev-list -n 1 "refs/tags/v$version")" >> "$GITHUB_OUTPUT"
            else
              echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "is_update_candidate=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "is_update_candidate=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check release workflow permissions
        if: steps.release_meta.outputs.validate_only != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ steps.release_meta.outputs.ref }}
        run: bash scripts/check-release-workflow-permission.sh "$RELEASE_REF"

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      # One package test task at a time: each Cargo invocation finishes
      # compiling before its test binaries run, so rustc never competes with
      # the server and desktop suites (about thirty of them hold 2-second
      # deadlines that starved hosted runners have missed).
      - name: Test
        if: steps.release_meta.outputs.validate_only != 'true'
        run: vp run -r --concurrency-limit 1 test

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel "${{ steps.release_meta.outputs.release_channel }}" \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

  relay_public_config:
    name: Resolve BiBCode Connect public config
    needs: preflight
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    outputs:
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      # Fork adaptation: upstream hard-requires a deployed Cloudflare relay +
      # Clerk config here, which gates the entire desktop build matrix. When
      # none of that is configured, emit an empty public config so the desktop
      # artifacts still build (the apps treat empty cloud config as
      # "BiBCode Connect disabled").
      - id: relay_mode
        name: Detect relay configuration
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relay deployment configuration found; releasing without BiBCode Connect cloud features."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.relay_mode.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Vite+
        if: steps.relay_mode.outputs.enabled == 'true'
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=bibcode-relay...

      - id: relay_state
        if: steps.relay_mode.outputs.enabled == 'true'
        name: Read production relay state
        shell: bash
        run: |
          vp run --filter bibcode-relay deploy \
            --stage prod \
            --read-state \
            --github-output

      - id: public_config
        name: Resolve production relay public config
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.relay_mode.outputs.enabled }}" != "true" ]]; then
            echo "clerk_publishable_key=" >> "$GITHUB_OUTPUT"
            echo "clerk_jwt_template=" >> "$GITHUB_OUTPUT"
            echo "clerk_cli_oauth_client_id=" >> "$GITHUB_OUTPUT"
            echo "relay_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          relay_domain="${RELAY_DOMAIN:-}"
          if [[ -z "$relay_domain" && -n "${RELAY_API_ZONE_NAME:-}" ]]; then
            relay_domain="relay.$RELAY_API_ZONE_NAME"
          fi
          required=(
            relay_domain
            CLERK_PUBLISHABLE_KEY
            CLERK_JWT_TEMPLATE
            CLERK_CLI_OAUTH_CLIENT_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required relay deployment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          echo "clerk_publishable_key=$CLERK_PUBLISHABLE_KEY" >> "$GITHUB_OUTPUT"
          echo "clerk_jwt_template=$CLERK_JWT_TEMPLATE" >> "$GITHUB_OUTPUT"
          echo "clerk_cli_oauth_client_id=$CLERK_CLI_OAUTH_CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "relay_url=https://$relay_domain" >> "$GITHUB_OUTPUT"

  build_desktop:
    name: Build ${{ matrix.label }}
    needs: [preflight, relay_public_config]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.jobTimeoutMinutes }}
    env:
      BIBCODE_CLERK_PUBLISHABLE_KEY: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      BIBCODE_CLERK_JWT_TEMPLATE: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      BIBCODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      BIBCODE_RELAY_URL: ${{ needs.relay_public_config.outputs.relay_url }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ needs.preflight.outputs.is_update_candidate == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.preflight.outputs.is_update_candidate == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            jobTimeoutMinutes: 90
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
            jobTimeoutMinutes: 150
          - label: Linux arm64
            runner: ubuntu-22.04-arm
            platform: linux
            target: appimage
            arch: arm64
            jobTimeoutMinutes: 90
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux
            target: appimage
            arch: x64
            jobTimeoutMinutes: 90
          - label: Windows arm64
            runner: windows-11-vs2026-arm
            platform: win
            target: nsis
            arch: arm64
            jobTimeoutMinutes: 90
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            jobTimeoutMinutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package manifest versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/desktop/src-tauri

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      - name: Verify stable updater signing configuration
        if: needs.preflight.outputs.is_update_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" || -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then
            echo "Stable releases require Tauri updater signing configuration." >&2
            exit 1
          fi

      - name: Verify macOS icon raster fixtures
        if: matrix.platform == 'mac'
        run: swift scripts/check-macos-app-icon.swift --self-test

      # build-desktop-artifact.ts --symbols runs dump_syms on the unstripped binary. Rust Cache
      # keeps ~/.cargo/bin, so a restored runner skips the compile.
      - name: Install dump_syms
        run: node scripts/run-msvc.mjs cargo install dump_syms --locked --version 2.3.9

      - name: Build desktop artifact
        shell: bash
        run: |
          args=(node scripts/build-desktop-artifact.ts \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --output-dir release \
            --symbols \
            --verbose)
          if [[ "${{ needs.preflight.outputs.is_update_candidate }}" == "true" ]]; then
            args+=(--updater)
          fi
          "${args[@]}"

      - name: Verify macOS ad-hoc application signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmg_paths=(release/*.dmg)
          if (( ${#dmg_paths[@]} != 1 )); then
            printf 'Expected exactly one macOS DMG in release/, found %s.\n' "${#dmg_paths[@]}" >&2
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          cleanup() {
            printf '%s\n' 'mac-icon-observation {"stage":"workflow-cleanup-entered"}' >&2 || true
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || hdiutil detach -force "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
            printf '%s\n' 'mac-icon-observation {"stage":"workflow-cleanup-returned"}' >&2 || true
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -noautoopen \
            -mountpoint "$mount_dir" "${dmg_paths[0]}" >/dev/null

          app_paths=("$mount_dir"/*.app)
          if (( ${#app_paths[@]} != 1 )); then
            printf 'Expected exactly one application in the DMG, found %s.\n' "${#app_paths[@]}" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "${app_paths[0]}"
          signature_details="$(codesign --display --verbose=4 "${app_paths[0]}" 2>&1)"
          printf '%s\n' "$signature_details"
          grep -Fq 'Signature=adhoc' <<< "$signature_details"
          grep -Fq 'TeamIdentifier=not set' <<< "$signature_details"
          printf '%s\n' 'mac-icon-observation {"stage":"workflow-swift-dispatched"}' >&2 || true
          swift scripts/check-macos-app-icon.swift "${app_paths[0]}"
          printf '%s\n' 'mac-icon-observation {"stage":"workflow-swift-succeeded"}' >&2 || true

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/bibcode-desktop-symbols-*.zip"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          if [[ "${{ needs.preflight.outputs.is_update_candidate }}" == "true" ]]; then
            for pattern in \
              "release/*.app.tar.gz" \
              "release/*.sig" \
              "release/updater-*.json"; do
              for file in $pattern; do
                cp "$file" release-publish/
              done
            done
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  build_server:
    name: Build server ${{ matrix.label }}
    needs: [preflight, relay_public_config]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      BIBCODE_CLERK_PUBLISHABLE_KEY: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      BIBCODE_CLERK_JWT_TEMPLATE: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      BIBCODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      BIBCODE_RELAY_URL: ${{ needs.relay_public_config.outputs.relay_url }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-26
            platform: mac
            arch: arm64
            serverOs: darwin
            serverArch: aarch64
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            arch: x64
            serverOs: darwin
            serverArch: x86_64
          - label: Linux arm64
            runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            serverOs: linux
            serverArch: aarch64
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            serverOs: linux
            serverArch: x86_64
          - label: Windows arm64
            runner: windows-11-vs2026-arm
            platform: win
            arch: arm64
            serverOs: windows
            serverArch: aarch64
          - label: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
            serverOs: windows
            serverArch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package manifest versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      - name: Build production web client
        run: vp run --filter @bibcode/web build

      - name: Build Linux server on the compatibility baseline
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          docker_arch="amd64"
          expected_uname="x86_64"
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            docker_arch="arm64"
            expected_uname="aarch64"
          fi
          docker run --rm \
            --platform "linux/$docker_arch" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace \
            --env EXPECTED_UNAME="$expected_uname" \
            --env HOST_GID="$(id -g)" \
            --env HOST_UID="$(id -u)" \
            --env RUST_TARGET="${{ matrix.serverArch }}-unknown-linux-gnu" \
            --env CARGO_PROFILE_RELEASE_STRIP=none \
            --env CARGO_PROFILE_RELEASE_DEBUG=line-tables-only \
            --env "RUSTFLAGS=-C link-arg=-Wl,--build-id=sha1" \
            ubuntu:20.04 \
            bash -lc '
              set -euo pipefail
              test "$(uname -m)" = "$EXPECTED_UNAME"
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates cmake curl perl pkg-config
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain 1.98.1
              /root/.cargo/bin/cargo build -p bibcode-server --bin bibcode --release --target "$RUST_TARGET"
              chown -R "$HOST_UID:$HOST_GID" /workspace/target
            '

      - name: Build macOS or Windows server
        if: matrix.platform != 'linux'
        shell: bash
        # Unstripped, with line tables, for dump_syms; the next steps strip the binary. Packed
        # split debug info makes a dSYM on macOS and is already the MSVC default.
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
        run: |
          set -euo pipefail
          cargo_args=(cargo build -p bibcode-server --bin bibcode --release --target "${{ matrix.serverArch }}-${{ matrix.platform == 'mac' && 'apple-darwin' || 'pc-windows-msvc' }}")
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            node scripts/run-msvc.mjs "${cargo_args[@]}"
          else
            "${cargo_args[@]}"
          fi

      # Rust Cache keeps ~/.cargo/bin, so a restored runner skips the compile.
      - name: Install dump_syms
        run: node scripts/run-msvc.mjs cargo install dump_syms --locked --version 2.3.9

      # The archive lands in server-release/, so the server-release/*.zip upload carries it.
      - name: Dump and strip server symbols
        shell: bash
        run: |
          set -euo pipefail
          release_dir="target/${{ matrix.serverArch }}-${{ matrix.platform == 'mac' && 'apple-darwin' || matrix.platform == 'win' && 'pc-windows-msvc' || 'unknown-linux-gnu' }}/release"
          args=(node scripts/dump-symbols.ts \
            --out server-symbols \
            --zip "server-release/bibcode-server-symbols-${{ needs.preflight.outputs.version }}-${{ matrix.serverOs }}-${{ matrix.serverArch }}.zip")
          case "${{ matrix.platform }}" in
            linux) args+=(--binary "$release_dir/bibcode" --module-name bibcode) ;;
            mac) args+=(--binary "$release_dir/bibcode" --module-name bibcode --dsym "$release_dir/bibcode.dSYM") ;;
            win) args+=(--binary "$release_dir/bibcode.exe" --module-name bibcode.exe --pdb "$release_dir/bibcode.pdb") ;;
          esac
          "${args[@]}"
          # The shipped profile strips symbols as rustc does for executables (plain strip on macOS;
          # -x is the level for dynamic libraries). Windows keeps them in the PDB, which is not
          # shipped. A stripped copy replaces the binary, because Cargo's binary is a hard link to
          # its cached deps/ artifact, which an in-place strip would strip as well.
          stripped="$release_dir/bibcode.stripped"
          case "${{ matrix.platform }}" in
            linux) strip --strip-all -o "$stripped" "$release_dir/bibcode" ;;
            mac) strip -o "$stripped" "$release_dir/bibcode" ;;
          esac
          if [[ -e "$stripped" ]]; then mv "$stripped" "$release_dir/bibcode"; fi
          # Apple silicon runs only signed code. The linker ad-hoc signs arm64 executables, and
          # the stripped binary must keep a valid signature; Intel executables are not signed.
          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" == "arm64" ]]; then
            codesign --verify --verbose=2 "$release_dir/bibcode"
          fi

      - name: Build standalone server artifacts
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.serverArch }}-${{ matrix.platform == 'mac' && 'apple-darwin' || matrix.platform == 'win' && 'pc-windows-msvc' || 'unknown-linux-gnu' }}/release/bibcode"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary="$binary.exe"
          fi
          node scripts/build-server-artifact.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --output-dir server-release \
            --skip-build \
            --binary-path "$binary" \
            --web-dir apps/web/dist \
            --verbose

      - name: Smoke standalone server distribution
        shell: bash
        run: |
          set -euo pipefail
          binary="server-release/staging/bibcode-server-v${{ needs.preflight.outputs.version }}-${{ matrix.serverOs }}-${{ matrix.serverArch }}/bibcode"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary="$binary.exe"
          fi
          node scripts/smoke-server-distribution.ts \
            --binary "$binary" \
            --expected-version "${{ needs.preflight.outputs.version }}" \
            --timeout-ms 60000

      - name: Test Linux server packages in native containers
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find server-release -maxdepth 1 -type f -name '*.deb' -print -quit)"
          rpm="$(find server-release -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$deb"
          test -n "$rpm"
          node scripts/test-linux-server-package.ts \
            --arch "${{ matrix.arch }}" \
            --expected-version "${{ needs.preflight.outputs.version }}" \
            --package "$deb" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-deb-${{ matrix.arch }}"
          node scripts/test-linux-server-package.ts \
            --arch "${{ matrix.arch }}" \
            --expected-version "${{ needs.preflight.outputs.version }}" \
            --package "$rpm" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-rpm-${{ matrix.arch }}"

      - name: Upload server artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            server-release/*.tar.gz
            server-release/*.zip
            server-release/*.deb
            server-release/*.rpm
          if-no-files-found: error

  # CLI publishing remains omitted until the `bibcode` package has its own npm
  # trusted-publisher binding. Configure that binding before restoring the job.

  release:
    name: Publish GitHub Release
    needs: [preflight, build_desktop, build_server]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build_desktop.result == 'success' && needs.build_server.result == 'success' }}
    runs-on: ubuntu-24.04
    # The twelve symbol archives add about 470 MB to download, assemble, and upload.
    timeout-minutes: 25
    # Fork adaptation: publish with the workflow's own GITHUB_TOKEN instead of
    # upstream's release GitHub App (RELEASE_APP_ID/RELEASE_APP_PRIVATE_KEY).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual repair/publication runs use the current release controller while every
          # product build remains pinned to the immutable tag resolved by preflight.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download all desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-downloads/desktop

      - name: Download all server artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          merge-multiple: true
          path: release-downloads/server

      - name: Merge isolated release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for directory in release-downloads/desktop release-downloads/server; do
            while IFS= read -r -d '' file; do
              target="release-assets/$(basename "$file")"
              if [[ -e "$target" ]]; then
                echo "Duplicate release asset basename: $(basename "$file")" >&2
                exit 1
              fi
              cp "$file" "$target"
            done < <(find "$directory" -maxdepth 1 -type f -print0)
          done

      - id: release_timestamp
        name: Capture release timestamp
        if: needs.preflight.outputs.is_update_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf 'pub_date=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build Tauri update manifest
        if: needs.preflight.outputs.is_update_candidate == 'true'
        shell: bash
        run: |
          node scripts/build-tauri-update-manifest.ts \
            --assets-dir release-assets \
            --version "${{ needs.preflight.outputs.version }}" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --repository "${{ github.repository }}" \
            --pub-date "${{ steps.release_timestamp.outputs.pub_date }}" \
            --notes "${{ needs.preflight.outputs.release_name }}" \
            --output release-assets/latest.json

      - name: Verify Tauri update signatures
        if: needs.preflight.outputs.is_update_candidate == 'true'
        shell: bash
        run: |
          cargo run --locked -p bibcode-updater-verifier -- apps/desktop/src-tauri/tauri.release.conf.json release-assets/latest.json release-assets

      - name: Assemble validated release assets
        shell: bash
        env:
          SERVER_SIGNING_PRIVATE_KEY: ${{ secrets.BIBCODE_SERVER_SIGNING_PRIVATE_KEY }}
          SERVER_SIGNING_PUBLIC_KEY: ${{ secrets.BIBCODE_SERVER_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          args=(node scripts/assemble-release-assets.ts \
            --assets-dir release-assets \
            --version "${{ needs.preflight.outputs.version }}" \
            --step-summary "$GITHUB_STEP_SUMMARY")
          if [[ "${{ needs.preflight.outputs.is_update_candidate }}" == "true" ]]; then
            args+=(--updater)
          fi
          if [[ -n "${SERVER_SIGNING_PRIVATE_KEY:-}" || -n "${SERVER_SIGNING_PUBLIC_KEY:-}" ]]; then
            if [[ -z "${SERVER_SIGNING_PRIVATE_KEY:-}" || -z "${SERVER_SIGNING_PUBLIC_KEY:-}" ]]; then
              echo "Server signing requires both private and public keys." >&2
              exit 1
            fi
            cargo install minisign --version 0.9.1 --locked
            private_key="$RUNNER_TEMP/bibcode-server-signing.key"
            public_key="$RUNNER_TEMP/bibcode-server-signing.pub"
            printf '%s' "$SERVER_SIGNING_PRIVATE_KEY" > "$private_key"
            printf '%s' "$SERVER_SIGNING_PUBLIC_KEY" > "$public_key"
            chmod 600 "$private_key" "$public_key"
            args+=(--server-signing-key "$private_key" --server-signing-public-key "$public_key")
          fi
          "${args[@]}"

      - name: Upload validated release assets
        if: needs.preflight.outputs.validate_only == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-release-assets
          path: release-assets/*
          if-no-files-found: error

      - name: Recheck release workflow permissions
        if: needs.preflight.outputs.validate_only != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.preflight.outputs.ref }}
        run: bash scripts/check-release-workflow-permission.sh "$RELEASE_REF"

      - name: Require inspected stable draft
        if: needs.preflight.outputs.validate_only != 'true' && needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.preflight.outputs.ref }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" = "$RELEASE_REF"

      - name: Prepare stable release assets
        if: needs.preflight.outputs.validate_only != 'true' && needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested != 'true'
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > expected-assets.txt

      - name: Publish stable release
        if: needs.preflight.outputs.validate_only != 'true' && needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested != 'true' && needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          draft: true
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish first stable release
        if: needs.preflight.outputs.validate_only != 'true' && needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested != 'true' && needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          draft: true
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release
        if: needs.preflight.outputs.validate_only != 'true' && needs.preflight.outputs.release_channel == 'nightly' && needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: true
          make_latest: false
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish first nightly release
        if: needs.preflight.outputs.validate_only != 'true' && needs.preflight.outputs.release_channel == 'nightly' && needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify stable draft release assets
        if: needs.preflight.outputs.validate_only != 'true' && needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
            LC_ALL=C sort > uploaded-assets.txt
          diff -u expected-assets.txt uploaded-assets.txt

      - name: Publish approved stable release
        if: needs.preflight.outputs.validate_only != 'true' && needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_UPDATE_CANDIDATE: ${{ needs.preflight.outputs.is_update_candidate }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          publish_args=(gh release edit "$RELEASE_TAG" --draft=false)
          if [[ "$IS_UPDATE_CANDIDATE" == "true" ]]; then
            publish_args+=(--latest)
          fi
          "${publish_args[@]}"

  # Fork adaptation: upstream's `deploy_web` job (hosted web app on Vercel,
  # hosted web domains) is omitted — it targets a separately configured Vercel project.
  # Configure your own Vercel project and domains before restoring it.

  finalize:
    name: Finalize release
    if: ${{ needs.preflight.outputs.validate_only != 'true' && !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested == 'true' }}
    needs: [preflight, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Fork adaptation: push the version-bump commit with the workflow's own
    # GITHUB_TOKEN instead of upstream's release GitHub App. Note this only
    # works while `main` has no branch protection blocking the token, and the
    # push will not trigger other workflows (GitHub suppresses workflow runs
    # for GITHUB_TOKEN pushes, which also prevents release/deploy loops).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@bibcode/scripts...
              - --filter=@bibcode/oxlint-plugin-bibcode...

      - id: update_versions
        name: Update version strings
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION" --github-output

      - name: Format package.json files
        if: steps.update_versions.outputs.changed == 'true'
        run: vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: vp install --lockfile-only --ignore-scripts

      - name: Commit and push version bump
        if: steps.update_versions.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json apps/server/Cargo.toml apps/desktop/src-tauri/Cargo.toml Cargo.lock pnpm-lock.yaml; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json apps/server/Cargo.toml apps/desktop/src-tauri/Cargo.toml Cargo.lock pnpm-lock.yaml
          git commit -m "chore(release): prepare $RELEASE_TAG"
          git push origin HEAD:main

  # Fork adaptation: upstream's `announce_discord` job (Discord release
  # announcements) is omitted — this fork has no Discord server.
