name: coddy-studio-server
arch: ${CODDY_STUDIO_SERVER_PACKAGE_ARCH}
platform: linux
version: ${CODDY_STUDIO_SERVER_PACKAGE_VERSION}
release: 1
section: devel
priority: optional
maintainer: CoddyStudio Maintainers <mubeda@users.noreply.github.com>
description: Native CoddyStudio server and version-matched web client
homepage: https://github.com/mubeda/CoddyStudio
license: MIT
contents:
  - src: ${CODDY_STUDIO_SERVER_PACKAGE_ROOT}/coddy-studio
    expand: true
    dst: /usr/bin/coddy-studio
    file_info:
      mode: 0755
  - src: ${CODDY_STUDIO_SERVER_PACKAGE_ROOT}/web
    expand: true
    dst: /usr/share/coddy-studio/web
    type: tree
  - src: ${CODDY_STUDIO_SERVER_PACKAGE_ROOT}/README.md
    expand: true
    dst: /usr/share/doc/coddy-studio-server/README.md
    file_info:
      mode: 0644
  - src: ${CODDY_STUDIO_SERVER_PACKAGE_ROOT}/LICENSE
    expand: true
    dst: /usr/share/doc/coddy-studio-server/LICENSE
    file_info:
      mode: 0644
