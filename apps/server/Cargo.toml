[package]
name = "bibcode-server"
version = "0.9.3"
description = "BiBCode Rust server runtime"
default-run = "bibcode"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "bibcode_server"
path = "src/lib.rs"

[[bin]]
name = "bibcode"
path = "src/main.rs"

# The CI crash smoke: arms the crash monitor, then crashes in a named function.
[[bin]]
name = "crash-smoke"
path = "src/bin/crash_smoke.rs"

[features]
hermetic-test-guard = []

[dependencies]
axum.workspace = true
backtrace.workspace = true
base64.workspace = true
breakpad-symbols.workspace = true
bytes.workspace = true
clap.workspace = true
crash-handler.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jpeg-encoder.workspace = true
mime_guess.workspace = true
minidump.workspace = true
minidump-processor.workspace = true
minidumper.workspace = true
notify.workspace = true
object.workspace = true
open.workspace = true
percent-encoding.workspace = true
p256.workspace = true
portable-pty.workspace = true
process-wrap.workspace = true
prost.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snow.workspace = true
subtle.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zip.workspace = true
flate2.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
bibcode-server = { workspace = true, features = ["hermetic-test-guard"] }
tempfile.workspace = true
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The iOS simulator backend loads CoreSimulator in-process; exact pins, see the dependency ledger.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = { version = "=0.6.4", features = ["exception"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CMBlockBuffer",
  "CMFormatDescription",
  "CMSampleBuffer",
  "CMTime",
] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVPixelBufferIOSurface",
  "CVPixelBufferPool",
  "CVReturn",
  "objc2-io-surface",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSError",
  "NSString",
  "NSUUID",
] }
objc2-io-surface = { version = "=0.3.2", default-features = false, features = [
  "std",
  "IOSurfaceRef",
  "IOSurfaceTypes",
  "libc",
  "objc2",
  "objc2-core-foundation",
] }
objc2-video-toolbox = { version = "=0.3.2", default-features = false, features = [
  "std",
  "VTCompressionProperties",
  "VTCompressionSession",
  "VTErrors",
  "VTPixelRotationProperties",
  "VTPixelRotationSession",
  "VTSession",
  "objc2-core-media",
  "objc2-core-video",
] }
png = "=0.18.1"

[target.'cfg(windows)'.dependencies]
junction.workspace = true
windows-sys = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_IO",
  "Win32_System_Kernel",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
